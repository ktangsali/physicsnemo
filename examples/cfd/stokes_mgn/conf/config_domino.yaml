hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

ckpt_path: "./checkpoints_domino"
ckpt_name: "./stokes_domino.pt"
data_dir: "./physics-curated"
results_dir: "./results_domino"
validation_image: "validation_vis.png"

batch_size: 1
epochs: 100

num_training_samples: 128
num_validation_samples: 100
num_test_samples: 10

lr: 3e-4
# If not set, will be calculated based on the number of epochs.
lr_decay_rate: null

# Transolver model configuration (for irregular/unstructured mesh)
model:
  n_layers: 4
  n_hidden: 128
  dropout: 0.0
  n_head: 4
  act: "gelu"
  mlp_ratio: 1
  slice_num: 32
  ref: 8

# Physics-informed losses (FVM residuals: continuity + momentum)
add_physics_loss: True
continuity_weight: 1e9  # Weight for continuity residual (cell volumes are very small)
momentum_weight: 1e9    # Weight for momentum residuals
nu: 0.01                # Kinematic viscosity for Stokes flow

# Boundary condition losses
add_bc_loss: True
inlet_weight: 1.0
noslip_weight: 1.0
U_max: 0.3  # Maximum velocity for parabolic inlet profile