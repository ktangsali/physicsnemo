output_dir: "runs"
run_id: "airfrans/float32_full_uq_1"

# Training configuration
training:
  precision: float32 # float32, float16, bfloat16, or float8
  num_epochs: 501 # Add one to save at 250
  save_interval: 25  # Save checkpoint every N epochs
  compile: false

# Model configuration
model:
  _target_: physicsnemo.models.transolver.Transolver
  functional_dim: 3 # Input feature dimension (air_density, stream_velocity, angle_of_attack)
  out_dim: 4        # Output feature dimension (U_x, U_y, p, nut) - w component excluded for 2D sim
  embedding_dim: 16  # Spatial embedding dimension (mesh_centers[3] + sdf[1] + fourier_sin[6] + fourier_cos[6])
  n_layers: 4       # Number of transformer layers
  n_hidden: 128     # Hidden dimension
  dropout: 0.0      # Dropout rate
  n_head: 4         # Number of attention heads
  act: "relu"       # Activation function
  mlp_ratio: 4      # MLP ratio in attention blocks
  slice_num: 128     # Number of slices in physics attention
  unified_pos: false # Whether to use unified positional embeddings
  ref: 8            # Reference dimension for unified pos
  structured_shape: null
  use_te: false     # Use transformer engine
  time_input: false # Whether to use time embeddings

scheduler:
  name: "OneCycleLR"
  params:
    final_div_factor: 100  # Slower decay (initial_lr / final_div_factor = final LR)


# Optimizer configuration
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Data configuration
data:
  train:
    data_path: ../../../../../physicsnemo-curator/airfrans_dataset_1_processed_7/train
  val:
    data_path: ../../../../../physicsnemo-curator/airfrans_dataset_1_processed_7/val
  max_workers: 8
  pin_memory: true
  resolution: 300_000
  mode: volume
  ignore_w_component: true  # Exclude w (U_z) from predictions (2D simulation on 3D grid)
  data_keys:
    - "volume_fields"
    - "volume_mesh_centers"
    - "volume_sdf"
    - "air_density"
    - "stream_velocity"
    - "angle_of_attack"
    - "stl_areas"
    - "stl_centers"
  large_keys:
    - "volume_fields"
    - "volume_mesh_centers"
    - "volume_sdf"

# Logging configuration
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
