defaults:
  - training: base
  - model: geotransolver
  - data: surface

output_dir: "runs"
checkpoint_dir: null
run_id: "geotransolver/surface/field_gp"

# These defaults ARE the settled recipe: running this config with no overrides
# beyond the data paths and run_id reproduces the reference surface field-GP run.

# --- Field GP head ---
# The GP head replaces the readout: posterior mean = per-point field
# prediction, posterior variance = per-point uncertainty.
num_tasks: 4                   # pressure + 3 wall-shear-stress components
gp_n_inducing: 1024            # inducing points per task (shared structure)

# DKL feature extractor: pointwise MLP between the (wide) backbone features and
# the GP kernel. Reduces dim for an efficient ARD kernel + good inducing
# coverage. null = feed backbone features straight to the GP.
gp_mlp_hidden: [128, 16]

# --- GP kernel ---
# Lengthscale: [lower, upper] hard constraint on per-dimension ARD lengthscales.
# The 2.0 cap keeps the kernel from going near-global (which flattens the
# per-point variance into a single geometry-wide number).
gp_lengthscale_range: [0.01, 2.0]
# Lengthscale prior: [concentration, rate] for Gamma. null = no prior.
gp_lengthscale_prior: [2.0, 3.0]
# Outputscale prior: [concentration, rate] for Gamma. null = no prior.
gp_outputscale_prior: [2.0, 0.5]

# Feature normalisation applied to the GP-input (DKL) features. Fixes the
# feature scale so the lengthscale must do the smoothing, preventing the DKL
# map from shrinking feature distances to defeat the lengthscale cap.
# One of: none | l2_radial.
#   l2_radial -> keep the L2-normalised direction AND append the standardised
#                pre-norm magnitude as one extra ARD dim. The magnitude is what
#                carries the radial out-of-distribution cue; projecting onto the
#                unit sphere alone erases it (OOD/in-dist std ratio -> ~1.0x).
gp_feature_norm: l2_radial

# --- Heteroscedastic observation noise ---
# Hidden sizes of an MLP mapping GP-input features -> per-point, per-channel
# observation noise. null keeps one learned noise scalar per channel, which
# dominates the total predictive variance and, being constant, makes the total
# std rank points identically to the epistemic std. Making it input-dependent is
# what lets the total std rank per-point |error|.
gp_noise_mlp_hidden: [64, 64]
# Hard clamp [lo, hi] on the per-point noise std. The lower bound is load
# bearing: the heteroscedastic ELBO weights each point by 1/sigma^2(x), so on
# unit-scale normalised fields a 1e-3 floor permits a weight of 1e6 and one
# collapsing point can blow up the loss. 0.01 caps that at 1e4, which sits just
# below the range the noise head actually uses.
gp_noise_std_range: [0.01, 10.0]
# Max global grad-norm for the GP head (0 = no clipping). Belt and braces
# against the optimiser overcorrecting after a noise excursion.
head_grad_clip_norm: 10.0

# --- KL / NLL annealing ---
# Negative ELBO is the field loss; ramp the KL weight (beta) 0->1 over the
# window so the data-fit term shapes the backbone + GP mean first.
beta_warmup_start: 0
beta_warmup_end: 30
# Constant multiplier on beta once the ramp completes (<1 loosens the KL pull
# toward the prior, letting the posterior keep more per-point structure).
gp_kl_weight: 0.5
# Ramp the weight on the whole negative ELBO 0->1 over this window, so the
# mean-MSE anchor leads the early epochs and the GP mean is accurate before the
# likelihood term is free to flatten the variance.
nll_warmup_start: 0
nll_warmup_end: 30

# Auxiliary MSE on the GP mean for early-training stability (0 disables).
lambda_mean_mse: 1.0

# --- Latent distance penalty ---
# One-sided hinge forcing point pairs with large target differences to also be
# far apart in GP-input (kernel) space, so the kernel can express larger
# variance where predictions differ. 0.0 disables.
dist_penalty_weight: 0.5
dist_penalty_pairs: 4096       # random point pairs sampled per geometry
dist_penalty_margin: 1.0       # multiplier on the normalised target distance

# Further point subsampling for the GP step (null = use all points the
# dataloader provides at data.resolution). Bounds the O(points) GP solve.
gp_points_per_step: 12288
# Points per geometry used to size the ELBO num_data normaliser.
# Defaults to data.resolution when null.
points_per_geometry: null

# --- Performance ---
# Use float32 — the GP internals run in float64 regardless. float16 + GradScaler
# is not recommended with the float64 GP loss.
precision: float32

# --- Training overrides ---
training:
  save_interval: 1
  num_epochs: 100
  gradient_accumulation_steps: 8

model:
  functional_dim: 6
  include_local_features: true
  radii: [0.01, 0.05, 0.25, 1.0, 2.5, 5.0]
  neighbors_in_radius: [4, 8, 16, 64, 128, 256]
  n_hidden_local: 32

data:
  include_sdf: false
  include_geometry: true
  geometry_sampling: 300_000
  broadcast_global_features: false
  # DrivAerStar surface fields are stored in raw physical units (Pa), so they
  # need their own normalisation stats. The stats in `src/` are nondimensional
  # (pressure-coefficient form) and belong to the DrivAer AWS runs -- pointing
  # this at `src/` would silently mis-scale every field by ~700x.
  normalization_dir: "src/normalization/drivaerstar/"
  # Points sampled per geometry per epoch. The GP cost scales with this, and
  # `gp_points_per_step` subsamples further for the kernel solve itself.
  resolution: 51200
  preload_depth: 4

logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
